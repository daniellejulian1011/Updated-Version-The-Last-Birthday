<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1012">
  <meta name="description" content="October 1983. A shuttered birthday palace, a ten-year-old cover-up, and a mascot that never speaks. An immersive first-person horror visual novel with eight endings.">
  <title>The Last Birthday · 1983 · Immersive Edition</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./immersive.css">
</head>
<body>
  <main id="game" aria-label="The Last Birthday interactive horror story">
    <canvas id="world" aria-hidden="true"></canvas>
    <div id="grain" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="transition" aria-hidden="true"></div>
    <div id="world-actions" aria-label="Objects in the scene"></div>

    <section id="title-screen" aria-label="Main menu">
      <div class="title-copy">
        <p class="eyebrow">A CANDLEWICK’S STORY</p>
        <h1><span>THE LAST</span><strong>BIRTHDAY</strong></h1>
        <p class="year"><span></span>1 9 8 3<span></span></p>
        <nav class="title-menu" aria-label="Main menu actions">
          <button id="new-game" class="menu-choice active">NEW GAME <span>↗</span></button>
          <button id="continue-game" class="menu-choice" disabled>CONTINUE <span>↗</span></button>
          <button id="title-settings" class="menu-choice">SETTINGS <span>↗</span></button>
          <button id="title-endings" class="menu-choice">THE ENDINGS <span>↗</span></button>
          <button id="title-credits" class="menu-choice">CASE FILE <span>↗</span></button>
        </nav>
        <p class="title-note">THE PARTY ENDED TEN YEARS AGO.<br>THE DOOR IS STILL OPEN.</p>
      </div>
      <button id="enter-door" class="door-action" aria-label="Enter Candlewick’s and start a new game"><span class="door-ring"></span><span class="door-label">ENTER CANDLEWICK’S</span></button>
      <div class="title-bottom"><span>OCTOBER 14, 1983</span><span>HEADPHONES RECOMMENDED</span><button id="sound-toggle">ENABLE SOUND</button></div>
    </section>

    <section id="play-screen" hidden aria-label="Game scene">
      <header class="hud-top">
        <div class="objective-block"><span id="chapter-label" class="eyebrow"></span><p id="objective"></p></div>
        <nav class="hud-tools" aria-label="Game tools">
          <button id="journal-button" title="Evidence and inventory (J)" aria-label="Open evidence journal">▤<span>JOURNAL</span><i id="evidence-count">0</i></button>
          <button id="map-button" title="Palace floor plan (M)" aria-label="Open palace map">⌖<span>MAP</span></button>
          <button id="save-button" title="Save and load" aria-label="Open save slots">▣<span>SAVE</span></button>
          <button id="pause-button" title="Pause (Escape)" aria-label="Pause game">Ⅱ<span>PAUSE</span></button>
        </nav>
      </header>
      <div id="crosshair" aria-hidden="true"><span></span></div>
      <div id="interaction-hint" hidden></div>
      <div id="danger" hidden><span>HE IS CLOSE</span><div class="danger-track"><i id="danger-fill"></i></div></div>
      <section id="puzzle-panel" hidden aria-label="Combination puzzle"></section>
      <div id="scene-announcement" aria-hidden="true"></div>
      <section class="narrative" id="narrative" aria-label="Story and choices">
        <div class="dialogue-top"><span id="speaker"></span><button id="hide-dialogue" aria-label="Collapse story text" title="Show more of the scene">−</button></div>
        <h2 id="node-title"></h2>
        <p id="story-text" aria-live="polite"></p>
        <div id="choices" aria-label="Choose what June does next"></div>
      </section>
      <footer class="hud-bottom">
        <div class="timestamp"><span id="clock">08:12 PM</span><span>OCT 14 1983</span></div>
        <div class="bottom-center"><span id="location-name"></span><span class="controls-reminder">360° LOOK · WASD MOVE · E INTERACT · SPACE USE</span></div>
        <button id="flashlight-button" class="torch-button" title="Original story torch (F)" aria-label="Toggle flashlight"><span class="torch-icon">◉</span><span id="battery-label">100%</span><span class="battery-track"><i id="battery-fill"></i></span></button>
      </footer>
    </section>

    <section id="ending-screen" hidden aria-label="Story ending"></section>
    <div id="toast" role="status" hidden></div>
    <div id="modal-backdrop" hidden>
      <section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <header class="modal-header"><div><span id="modal-kicker" class="eyebrow"></span><h2 id="modal-title"></h2></div><button id="modal-close" aria-label="Close panel">×</button></header>
        <div id="modal-body"></div>
      </section>
    </div>
  </main>
  <noscript><div class="no-script">THE LAST BIRTHDAY NEEDS JAVASCRIPT TO PLAY. ENABLE JAVASCRIPT, THEN RELOAD THIS PAGE.</div></noscript>
  <script type="module" src="./js/boot.js"></script>
  <script src="./js/immersive.js" defer></script>
</body>
</html>
